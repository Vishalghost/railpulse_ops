# Included in every location: nginx drops inherited add_header lines when a location adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The map API key is referer-restricted, so cross-origin tile requests must carry our origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Viewers only ever reach us over HTTPS via CloudFront.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP for a static Next.js export:
#  - 'unsafe-inline' scripts: the export inlines its bootstrap scripts and can't use per-request nonces
#  - *.amazonaws.com: Cognito token/JWKS calls and Amazon Location map tiles/styles
#  - *.api.aws: Amazon Location's dual-stack endpoints (a style may reference either domain)
#  - *.amazoncognito.com: Hosted UI token endpoint
#  - blob: workers: MapLibre renders in a web worker
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com https://*.api.aws; font-src 'self'; connect-src 'self' https://*.amazonaws.com https://*.api.aws https://*.amazoncognito.com; worker-src 'self' blob:; child-src blob:; media-src 'self' https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
